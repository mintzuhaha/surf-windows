# Surf Windows configuration.
# Preference states are strings: skip | ok | fav
# (Avoid on/off: YAML reads those as booleans.)

spot:
  id: pleasure-point
  name: Pleasure Point
  lat: 36.95469
  lon: -121.97253
  timezone: America/Los_Angeles
  noaa_station: "9413450"   # Monterey. Santa Cruz (9413745) only has high/low predictions; see DECISIONS.md
  faces_deg: 180            # direction the break faces, toward the ocean. Starting guess: set your own.
  high_tide_ft: 4.2         # tide reaching this (ft, MLLW) during an hour is "high". Break-specific: Pleasure Point is surfable below 4.2 ft.
  ideal_tide_ft: 3.7        # tide staying below this for the hour is favored. Pleasure Point: ideal below 3.7 ft.
  size_factor: 1.4          # gain of the surf-height model, fitted to 59 Surfline forecasts (Oct 28-Nov 4); see DECISIONS.md

size_buckets:               # Surfline-scale surf height in feet, [min, max)
  knee:     [1.0, 2.0]      # 1-2 ft
  waist:    [2.0, 3.0]      # 2-3 ft
  chest:    [3.0, 4.0]      # 3-4 ft (Surfline: waist to shoulder)
  head:     [4.0, 5.5]      # 4-5 and 4-6 ft
  overhead: [5.5, 6.5]      # 5-7 ft
  way_over: [6.5, 99.0]     # 6-8 ft and up: sets run past 7 ft

preferences:
  size:
    knee: skip
    waist: ok
    chest: fav
    head: fav
    overhead: ok              # surfable, but flagged with a big-wave warning (warn_sizes)
    way_over: skip            # beyond 7 ft is a no-go
  tide:
    low: ok
    mid: ok
    high: skip
  tide_direction:
    rising: true
    falling: true
  wind:
    glassy: fav
    light: ok
    windy: skip
  rain:
    skip_after_hours: 72
    threshold_in: 0.1
  warn_sizes: [overhead]      # sizes shown with a "⚠ Big waves" warning
  min_window_hours: 2
  tentative_after_days: 3
  free_hours:               # 24-hour clock, [start, end). All day by default; narrow these to your schedule.
    weekdays: [[0, 24]]
    weekends: [[0, 24]]
